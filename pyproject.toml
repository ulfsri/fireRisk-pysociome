[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pysociome"
version = "0.1.0"
description = "Operationalizing Social Determinants of Health Data in Python"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hossein Lotfi", email = "hlotfi@ulri.org" }]
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.3",
    "numpy>=1.21",
    "scikit-learn>=1.0",
    "requests>=2.25",
]

[project.urls]
Homepage = "https://github.com/ulfsri/fireRisk-pysociome"
Repository = "https://github.com/ulfsri/fireRisk-pysociome"
Issues = "https://github.com/ulfsri/fireRisk-pysociome/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pysociome*"]
